<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kidtapmod - Bio Link</title>
    <!-- Font chữ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #05070a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 80% 20%, rgba(165, 180, 252, 0.2) 0%, transparent 50%),
                              url('https://www.transparenttextures.com/patterns/dark-dotted.png');
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end; /* Căn phải nút menu */
            align-items: center;
            margin-bottom: 25px;
        }

        .menu-btn {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.1);
            color: #93c5fd;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .menu-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            transform: rotate(90deg);
        }

        /* Avatar */
        .magician-avatar-wrapper {
            position: relative;
            width: 145px;
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .magician-avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #1e40af, #a5b4fc, #dbeafe, #a5b4fc, #1e40af);
            animation: magicianRotate 6s linear infinite;
            z-index: 1;
            box-shadow: 0 0 15px rgba(165, 180, 252, 0.5);
        }

        .magician-avatar-wrapper::after {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 45% 55% 60% 40% / 60% 40% 60% 40%;
            border: 1px solid rgba(165, 180, 252, 0.3);
            animation: magicianRotate 8s linear infinite reverse;
            z-index: 0;
        }

        @keyframes magicianRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #05070a;
            overflow: hidden;
            background: #111; /* Màu nền tạm nếu chưa có ảnh */
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4b5563;
            font-size: 50px;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-user {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 10px;
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-user .fa-circle-check {
            color: #60a5fa;
            font-size: 14px;
        }

        .name-box {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #ffffff, #a5b4fc, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* Social buttons */
        .social-row {
            width: 100%;
            display: flex;
            gap: 10px;
            margin-bottom: 25px; /* Tăng khoảng cách */
        }

        .social-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px;
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: 0.3s;
        }

        .social-btn:hover {
            background: rgba(165, 180, 252, 0.1);
            border-color: #a5b4fc;
        }

        /* Link Cards */
        .link-card {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 16px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        .link-card:hover {
            background: rgba(165, 180, 252, 0.08);
            transform: translateX(5px);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .link-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            background: rgba(165, 180, 252, 0.15);
            color: #a5b4fc;
        }

        .link-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 3px;
            color: #f9fafb;
        }

        .link-info p {
            font-size: 12px;
            color: #9ca3af;
        }

        .link-action {
            color: #6b7280;
            font-size: 16px;
            flex-shrink: 0;
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Thanh menu -->
        <div class="top-bar">
            <a href="#" class="menu-btn">
                <i class="fa-solid fa-bars"></i>
            </a>
        </div>

        <!-- Khung Avatar -->
        <div class="magician-avatar-wrapper">
            <div class="avatar-container">
                <!-- Thay thế # bằng link ảnh thật của bạn, hoặc để trống nó sẽ hiện icon user -->
                <i class="fa-regular fa-user"></i>
                <!-- <img src="LINK_ANH_THAT_CUA_BAN.jpg" alt="Avatar"> -->
            </div>
        </div>

        <div class="badge-user">
            <span>kidtapmod</span>
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <div class="name-box">kidtapmod</div>

        <!-- Nút mạng xã hội -->
        <div class="social-row">
            <a href="#" class="social-btn">
                <i class="fa-brands fa-tiktok"></i> TikTok
            </a>
            <a href="#" class="social-btn discord-kid">
                <i class="fa-brands fa-discord"></i> Discord
            </a>
        </div>

        <!-- Các thẻ liên kết -->
        <a href="#" class="link-card">
            <div class="link-left">
                <div class="link-icon"><i class="fa-solid fa-arrow-down"></i></div>
                <div class="link-info">
                    <h3>Hướng dẫn cài mod ios</h3>
                    <p>Nhấn để xem chi tiết</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right link-action"></i>
        </a>
        
        <a href="#" class="link-card">
            <div class="link-left">
                <div class="link-icon"><i class="fa-solid fa-key"></i></div>
                <div class="link-info">
                    <h3>Lấy Key Mod</h3>
                    <p>Cập nhật hàng ngày</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right link-action"></i>
        </a>

    </div>

</body>
</html>
